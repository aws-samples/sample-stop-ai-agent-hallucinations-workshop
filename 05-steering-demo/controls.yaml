controls:
  - name: steer-max-guests
    description: Guide agent to split booking when guests exceed maximum of 10 per room
    enabled: true
    execution: sdk
    scope:
      step_types:
        - llm
      stages:
        - post
    selector:
      path: output
    # NOTE: evaluated with RE2, which has no lookahead or backreferences.
    # The pattern therefore also matches the agent's own corrective reply when that
    # reply restates the original total. This control cannot be made self-excluding
    # by narrowing the regex; the demo bounds steer retries instead (MAX_STEERS).
    evaluator:
      name: regex
      config:
        pattern: "(1[1-9]|[2-9]\\d)\\s*guest"
    action:
      decision: steer
      message: Guest count exceeds maximum of 10 per room
      steering_context:
        message: >
          The booking exceeds the hotel maximum of 10 guests per room.
          Split the reservation across multiple rooms: fill each room with 10 guests
          until all guests are accommodated, so a party of 15 becomes one room of 10
          and one room of 5. Call book_hotel once per room now, in a single turn,
          before writing any further explanation. Book each room exactly once — do
          not repeat a booking you have already made. Once every room is booked,
          tell the user how many rooms were reserved and the occupancy of each.
    tags:
      - booking
      - steer
      - capacity

  - name: deny-no-payment
    description: Block booking confirmation without prior payment
    enabled: true
    execution: sdk
    scope:
      step_types:
        - tool
      stages:
        - pre
      step_names:
        - confirm_booking
    selector:
      path: input
    evaluator:
      name: regex
      config:
        pattern: "BK\\d{3}"
    action:
      decision: deny
      message: Payment must be processed before confirming a booking
    tags:
      - booking
      - deny
      - payment
